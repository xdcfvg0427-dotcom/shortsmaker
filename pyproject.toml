[project]
name = "paper-studio-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40", "alembic==1.15.2",
  "pydantic==2.11.3", "pydantic-settings==2.8.1", "python-multipart==0.0.20",
  "pillow==11.2.1", "httpx==0.28.1", "psycopg[binary]==3.2.6"
]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.6", "pyyaml==6.0.2"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/backend"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tests/backend/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]
